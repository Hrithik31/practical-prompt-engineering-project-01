<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f5f2" />
    <title>Promptfolio | Prompt Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Promptfolio home">
          <span class="brand-mark" aria-hidden="true"
            ><span></span><span></span><span></span
          ></span>
          <span>promptfolio</span>
        </a>
        <div class="topbar-actions">
          <span class="device-status"
            ><span class="status-dot"></span> Private workspace</span
          >
          <button class="button button-primary" id="new-prompt" type="button">
            <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
              <path
                d="M10 4v12M4 10h12"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
            <span>New prompt</span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="library-panel" aria-label="Saved prompts">
          <div class="library-heading">
            <p class="eyebrow">YOUR WORKSPACE</p>
            <h1>Prompt library</h1>
            <p class="library-subtitle" id="library-summary">
              A quiet place for good ideas.
            </p>
          </div>

          <label class="search-box">
            <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
              <circle
                cx="8.8"
                cy="8.8"
                r="5.8"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="m13.2 13.2 4 4"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
            <span class="sr-only">Search saved prompts</span>
            <input
              id="search-prompts"
              type="search"
              placeholder="Search prompts"
              autocomplete="off"
            />
            <kbd>/</kbd>
          </label>

          <div class="list-heading">
            <span>ALL PROMPTS</span>
            <span class="prompt-count" id="visible-count">0</span>
          </div>
          <ul
            class="prompt-list"
            id="prompt-list"
            aria-label="Prompt list"
          ></ul>
          <div class="local-note">
            <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
              <rect
                x="3"
                y="5"
                width="14"
                height="12"
                rx="2"
                stroke="currentColor"
                stroke-width="1.4"
              />
              <path
                d="M7 5V3.8A1.8 1.8 0 0 1 8.8 2h2.4A1.8 1.8 0 0 1 13 3.8V5m-8 4h10"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
            <span>Saved on this device</span>
          </div>
        </aside>

        <section class="editor-panel" aria-label="Prompt editor">
          <div class="editor-topline">
            <div class="editor-context">
              <span class="context-mark" aria-hidden="true"></span>
              <span class="eyebrow" id="editor-mode">NEW PROMPT</span>
            </div>
            <button
              class="icon-button delete-button"
              id="delete-prompt"
              type="button"
              aria-label="Delete prompt"
              title="Delete prompt"
              hidden
            >
              <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
                <path
                  d="M4.5 6h11m-9.5 0 .6 10h6.8l.6-10M8 6V4h4v2m-3 3v4m2-4v4"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>

          <form id="prompt-form">
            <div class="field title-field">
              <label for="prompt-title">Title</label>
              <input
                id="prompt-title"
                name="title"
                type="text"
                placeholder="Give this prompt a name"
                maxlength="100"
                required
              />
            </div>

            <div class="field content-field">
              <div class="field-heading">
                <label for="prompt-content">Prompt</label>
                <span class="field-hint">Be as detailed as you need</span>
              </div>
              <textarea
                id="prompt-content"
                name="content"
                placeholder="Write or paste your prompt here..."
                required
              ></textarea>
            </div>

            <div class="editor-footer">
              <p
                class="save-message"
                id="save-message"
                role="status"
                aria-live="polite"
              >
                Only you can see your prompts.
              </p>
              <button class="button button-save" type="submit">
                <svg aria-hidden="true" viewBox="0 0 20 20" fill="none">
                  <path
                    d="M4 3.5h10.5L17 6v10.5H3V3.5h1Zm2 0v5h8v-5M6 16.5v-6h8v6"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linejoin="round"
                  />
                </svg>
                <span id="save-label">Save prompt</span>
              </button>
            </div>
          </form>
          <div class="editor-bottom-rule" aria-hidden="true"><span></span></div>
        </section>
      </main>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
